<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>S3 Photo Upload</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>📸 S3 Photo Upload</h1>

        <p class="subtitle">
            Upload a photo directly to Amazon S3
        </p>

        <div class="upload-box">

            <input
                type="file"
                id="photoInput"
                accept="image/*"
            >

            <button id="uploadBtn">
                Upload Photo
            </button>

            <div id="status"></div>

        </div>

    </div>

    <script src="app.js"></script>

</body>
</html>
